<head>
    <title>Javascript Data Grid</title>
    <link rel="stylesheet" href="./data-grid-enterprise.css">
</head>
<body>
    <div class="hidden-cols" ></div>
    <div class="controls">
        <input type="text" id="topLevelDataFilter" name="topLevelDataFilter" placeholder="Filter any column..." autocomplete="off" />
        <button type="button" id="btnXSelRows" disabled class="btn-ctrl-sel-rows hide">Deselect Rows</button>
        <button type="button" id="btnTogSelRows" disabled class="btn-ctrl-sel-rows hide">
            <i class="material-icons" aria-hidden="false">check_box_outline_blank</i>&nbsp;<span>Selected Rows</span>
        </button>
        <button id="btnReset" class="btn-reset" >Reset</button>
    </div>
    <div id="dataTableChecks" class="relly"></div>
    <div id="selFilContainer" class="relly"></div>
    <div id="validatedEdit" class="relly invisible"></div>
    <div class="relly" style="z-index: 10;"><div tabindex="0" id="fCellDragger" class="hide"></div></div>
    <div class="row-numbers" >
        <div id="rowNumHeader" class="row-num-header flex-center"><div class="semi-heavy">No.</div></div>
        <div style="overflow: hidden"><div id="rowNumBody" style="overflow: auto"></div></div>
    </div><div id="dataTable" class="data-table">
    <div id="dataTableHeaders" class="data-table-headers"></div>
    <div id="dataTableBody"><div id="aboveArea"></div><div id="belowArea"></div></div>
    </div>
    <div id="tableFooter" class="hide">
        <div class="paginator">
            <div class="paginator-half-wid">
                <div id="totalRows" class="inline v-mid semi-heavy lg-text"></div>&nbsp;<div class="inline v-mid">rows</div>
            </div>
        </div>
    </div>
    <script src="./deebo-js-grid-community.js"></script>
    <script>
        <!-- where data is an array of objects e.g. [ { name: "dave" }, {name: "amy" } ] -->
        var data = [ 
            {date: "may 3, 2026", description: "Added Group By and Jump To Row functionality for JavaScript", version: "v1.1" },
            {date: "may 3, 2026", description: "Enhanced grid accessibility related to Tab button", version: "v1.1" },
            {date: "may 1, 2026", description: "Dropped support for React. Sorry, but our developer specializes in Angular and JavaScript. Upon further testing, we can't in all good conscience sell something that we can't expertly guarantee the quality of."},
            {date: "april 27, 2026", description: "Update filter to check for equality on numeric columns by default if no comparison option is explicitly chosen", version: "v1.0" },
            {date: "april 27, 2026", description: "Enterprise only: added columnStyles - pass a column name and list of css rules per value", version: "v1.0" }, 
            {date: "april 26, 2026", description: "Added the typically expected behavior of sorting when the column name is clicked, not just the sort arrow", version: "v1.0" },
            {date: "april 25, 2026", description: "Fixed bug where cells failed to display correctly after clearing all sorts", version: "v1.0" }, 
            {date: "april 24, 2026", description: "https://deebodata.com/data-grid-community", version: "v1.0" },
            {date: "april 22, 2026", description: "Added YTD option to line graph time span options", version: "v1.0" }, 
        ];
        deebo.methods.setLoading()//add an overlay while your backend api is responding
        data = deebo.methods.convertNeededCols(data)
        dataTableService.methods.mainData = data.filter( function(d) { return true })
        dataTableService.methods.currFilData = data.filter( function(d) { return true })
        dataTableService.methods.mainDataLen = dataTableService.methods.mainData.length
        deebo.methods.buildInitUiDataTable(data, "#000035", "#e9e9e9", true)//any 2 css colors
        //deebo.methods.buildInitUiDataTable(data, "black", "skyblue", true)//true in 4th arg blocks edits   
        // //deebo.methods.buildInitUiDataTable(data, "black", "skyblue", true, true)//true in 5th arg hides row nums
    </script>
