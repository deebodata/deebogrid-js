<head>
    <title>Javascript Data Grid</title>
</head>
<body>
    <div id="deeboDataGridSection"></div>
    <script src="./deebo-js-grid-enterprise.js"></script>
    <script>
        deebo.methods.setInitApiUrl("http://127.0.0.1:8080/api/big-data-test")
        deebo.methods.setThemeColors("white", "red")
        // deebo.methods.setAltRows("#f5f3f3")
        deebo.methods.setColumnStyles(
        [
            { 
                column: "party", 
                css: [
                    { value: "Republican", color: "red", font_size: "18px" },
                    { value: "Democrat", color: "blue", font_size: "18px" },
                    { value: "Independent", color: "green", font_size: "18px" },
                ] 
            },
        ])
        deebo.methods.setColumnValueColors([
                {
                    column: "party",
                    valueColors: [
                        { value: "Republican", color: "rgb(255, 0, 0)" },
                        { value: "Democrat", color: "rgb(0, 0, 255)" },
                        { value: "Independent", color: "rgb(0, 255, 0)" }
                    ]
                },
                {
                    column: "gender",
                    valueColors: [
                        { value: "male", color: "rgb(0, 0, 255)" },
                        { value: "female", color: "#FFC0CB" },
                    ]
                }
        ])
        deebo.methods.setPieUncovered(["party"])
        deebo.methods.initDeeboData("")
    </script>
</body>
