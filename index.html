<head>
    <title>Javascript Data Grid</title>
</head>
<body>
    <div style="margin: 0 auto; width: 89%;">
        <div id="deeboDataGridSection"></div>
    </div>
    <script src="./deebo-js-grid-enterprise.js"></script>
    <script>
        deebo.methods.setInitMethod("GET")//sets http method
        deebo.methods.setInitResProp("result")//sets property in response with the array
        deebo.methods.setInitApiUrl("https://d2ffvluimla00s.cloudfront.net/stim_imgs_comm.json")//api url
        deebo.methods.initDeeboData("LICENSE KEY")//leave 2nd arg undefined so deebodata loads from your api
    </script>
</body>
